[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thalweg"
version = "0.0.1"
license = "Apache-2.0"
description = "thalweg: centerlines, branches and wall geometry of tubular structures, read from a segmentation model's field"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
torch = ["torch>=2.7"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/thalweg"]

[tool.ruff]
line-length = 110
